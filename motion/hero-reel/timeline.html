<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Luilka, boucle du héros</title>
<style>html,body{margin:0;background:#000}svg{display:block}</style>
</head>
<body>
<svg id="stage" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="880" viewBox="0 0 1200 880"></svg>
<script>
const W = 1200, H = 880, FPS = 24, DURATION = 8, STEP = 2, OFFSET = 0.3, FADE = 0.7;
const IMG = { w: 1320, h: 968 };
const SAFE_X = 280;
const STEPS = [
  { n: "01", label: "Cadrage", line: "Le problème, les personnes, l'objectif." },
  { n: "02", label: "Design", line: "Parcours, langage visuel et écrans." },
  { n: "03", label: "Construction", line: "De l'interface à la mise en ligne." },
  { n: "04", label: "Lancement", line: "La page produit, le ton, les messages." },
];
const clamp = (v) => Math.min(1, Math.max(0, v));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const easeOutQuart = (x) => 1 - Math.pow(1 - x, 4);
const easeInOutCubic = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const easeInOutSine = (x) => -(Math.cos(Math.PI * x) - 1) / 2;

const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs = {}, parent) => {
  const node = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  if (parent) parent.appendChild(node);
  return node;
};
const stage = document.getElementById("stage");
const defs = el("defs", {}, stage);
const shade = el("linearGradient", { id: "shade", x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
el("stop", { offset: "0.5", "stop-color": "#000", "stop-opacity": 0 }, shade);
el("stop", { offset: "1", "stop-color": "#000", "stop-opacity": 0.88 }, shade);
const topShade = el("linearGradient", { id: "top", x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
el("stop", { offset: "0", "stop-color": "#000", "stop-opacity": 0.35 }, topShade);
el("stop", { offset: "0.25", "stop-color": "#000", "stop-opacity": 0 }, topShade);
el("rect", { width: W, height: H, fill: "#000" }, stage);

const FONT = "Noto Sans Display, Helvetica, Arial, sans-serif";
const scenes = STEPS.map((step, i) => {
  const g = el("g", {}, stage);
  const photo = el("g", {}, g);
  const img = el("image", { href: `photos/step-${i + 1}.jpg`, x: (W - IMG.w) / 2, y: (H - IMG.h) / 2, width: IMG.w, height: IMG.h, preserveAspectRatio: "xMidYMid slice" }, photo);
  el("rect", { width: W, height: H, fill: "url(#shade)" }, g);
  el("rect", { width: W, height: H, fill: "url(#top)" }, g);
  const text = el("g", {}, g);
  const label = el("text", { x: SAFE_X, y: 760, "font-family": FONT, "font-size": 78, "font-weight": 600, "letter-spacing": -2.5, fill: "#fff" }, text);
  label.textContent = step.label;
  const line = el("text", { x: SAFE_X + 3, y: 806, "font-family": FONT, "font-size": 27, "font-weight": 400, fill: "#fff", "fill-opacity": 0.82 }, text);
  line.textContent = step.line;
  const number = el("text", { x: SAFE_X + 3, y: 700, "font-family": FONT, "font-size": 22, "font-weight": 600, "letter-spacing": 4, fill: "#fff", "fill-opacity": 0.7 }, text);
  number.textContent = step.n;
  return { g, photo, img, label, line, number };
});

const bars = STEPS.map((_, i) => {
  const x = SAFE_X + i * 150;
  el("rect", { x, y: 56, width: 130, height: 3, rx: 1.5, fill: "#fff", "fill-opacity": 0.28 }, stage);
  return el("rect", { x, y: 56, width: 0, height: 3, rx: 1.5, fill: "#fff" }, stage);
});

function drawScene(i, t) {
  const s = scenes[i];
  const u = ((t - i * STEP + FADE) % DURATION + DURATION) % DURATION - FADE;
  const enter = easeInOutCubic(seg(u, -FADE, 0));
  const leave = easeInOutCubic(seg(u, STEP - FADE, STEP));
  const alive = u <= STEP ? 1 : 0;
  const zoom = 1.02 + 0.09 * easeInOutSine(clamp((u + FADE) / (STEP + FADE)));
  const drift = (u - STEP / 2) * -10;
  s.g.setAttribute("opacity", alive * enter * (1 - leave * (i === 3 ? 0 : 1)));
  s.photo.setAttribute("transform", `translate(${W / 2 + drift} ${H / 2}) scale(${zoom}) translate(${-W / 2} ${-H / 2})`);
  const rise = (a, size) => (1 - easeOutQuart(seg(u, a, a + 0.8))) * size;
  s.number.setAttribute("transform", `translate(0 ${rise(0.05, 24)})`);
  s.label.setAttribute("transform", `translate(0 ${rise(0.12, 36)})`);
  s.line.setAttribute("transform", `translate(0 ${rise(0.22, 28)})`);
  const textIn = seg(u, 0.05, 0.5), textOut = 1 - seg(u, STEP - 0.45, STEP - 0.1);
  [s.number, s.label, s.line].forEach((node) => node.setAttribute("opacity", clamp(textIn) * clamp(textOut)));
}

window.draw = (clock) => {
  const t = ((clock - OFFSET) % DURATION + DURATION) % DURATION;
  STEPS.forEach((_, i) => {
    drawScene(i, t);
    bars[i].setAttribute("width", 130 * clamp((t - i * STEP) / STEP));
  });
};
window.MOTION = { FPS, DURATION };
window.draw(new URLSearchParams(location.search).get("t") || 0);
</script>
</body>
</html>
